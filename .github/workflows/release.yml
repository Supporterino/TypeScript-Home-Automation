name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version PRs & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (for npm trusted publishing)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Guard dependency direction
        run: bun run scripts/guard-deps.ts

      - name: Guard shared-contract uniqueness
        run: bun run scripts/guard-contracts.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build workspace
        run: bun run build

      - name: Create Release PR or Publish
        uses: changesets/action@v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run publish
          commit-message: "chore: release"
          pr-title: "chore: release"
          create-github-releases: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
